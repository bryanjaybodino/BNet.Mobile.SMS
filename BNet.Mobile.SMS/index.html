<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>HTTP API</title>

    <style>
        body {
            background-color: whitesmoke;
            padding-top: 10%;
        }

        .chat-container {
            width: 310px;
            background-color: white;
            min-height: 310px;
            margin: auto;
            padding: 20px;
        }

        .chat-body textarea {
            width: calc(100% - 40px);
            border: none;
            height: 100px;
            box-shadow: rgba(0,0,0,.2) 0px 0px 0px 1px;
            padding: 20px;
        }

        .chat-body .btn {
            width: 100%;
            border: none;
            background: linear-gradient(90deg, rgba(37,165,228,1) 0%, rgba(40,135,229,1) 10%, rgba(41,161,229,1) 47%, rgba(37,92,228,1) 100%);
            padding: 10px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .chat-body .phone {
            box-shadow: rgba(0,0,0,.2) 0px 0px 0px 1px;
            padding: 10px;
            border: none;
            margin-bottom: 10px;
        }

        .chat-body #output {
            text-align: right;
        }

        .chat-body .message {
            display: flex;
            justify-content: flex-end;
        }

            .chat-body .message span {
                background-color: #255ce4;
                padding: 10px;
                border-radius: 10px;
                border-bottom-right-radius: 0px;
                color: white;
                width: fit-content;
                display: block;
            }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-body">
            <div id="output"></div>

            <input class="phone" placeholder="09xxx,09xxx"
                   value="09614348390"
                   id="phoneNumber" />

            <textarea placeholder="Enter Your Message" id="message"></textarea>

            <input class="btn" type="submit" value="send" onclick="SendMessage()" />
        </div>
    </div>

    <script>
        /* ================= CONFIG ================= */
        const API_BASE_URL = "http://192.168.1.5:8030";
        const output = document.getElementById('output');

        /* ================= HEALTH CHECK ================= */
        fetch(API_BASE_URL + "/status")
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(() => writeToScreen("CONNECTED"))
            .catch(() => writeToScreen("<span>ERROR: API Server is not running</span>"));

        /* ================= SEND MESSAGE ================= */
        function SendMessage() {
            var phoneNumber = document.getElementById('phoneNumber').value;
            var message = document.getElementById('message').value;

            if (message.trim() !== '') {

                var payload = {
                    receiver: phoneNumber,
                    message: message
                };

                writeToScreen('<div class="message"><span>' + message + '</span></div>');

                fetch(API_BASE_URL + "/send", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                })
                    .then(response => {
                        if (!response.ok) throw new Error();
                        return response.json();
                    })
                    .then(() => {
                        // Message successfully sent
                    })
                    .catch(() => {
                        writeToScreen("<span>ERROR: Failed to send message</span>");
                    });

                document.getElementById('message').value = '';
                document.getElementById('message').focus();
            }
        }

        /* ================= OUTPUT ================= */
        function writeToScreen(message) {
            var pre = document.createElement('p');
            pre.style.wordWrap = 'break-word';
            pre.innerHTML = message;
            output.appendChild(pre);
        }
    </script>
</body>
</html>
